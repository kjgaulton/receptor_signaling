[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receptor-screen"
version = "0.1.0"
description = "Donor-held-out receptor expression prediction screen"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "anndata>=0.10"]

[project.scripts]
receptor-screen = "receptor_screen.cli:main"

[tool.setuptools.packages.find]
include = ["receptor_screen*"]
